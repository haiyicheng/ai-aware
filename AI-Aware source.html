const Button = ({ children, onClick, variant = "primary", size = "lg", as = "button", href, disabled, style, ariaLabel, ...rest }) => {
  const base = {
    fontFamily: 'inherit',
    fontWeight: 600,
    letterSpacing: '-0.005em',
    borderRadius: 999,
    cursor: disabled ? 'not-allowed' : 'pointer',
    transition: 'transform .08s ease, background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease',
    display: 'inline-flex',
    alignItems: 'center',
    justifyContent: 'center',
    gap: 12,
    textDecoration: 'none',
    border: '2px solid transparent',
    whiteSpace: 'nowrap',
  };
  const sizes = {
    lg: { fontSize: 20, padding: '18px 32px', minHeight: 60 },
    md: { fontSize: 18, padding: '14px 24px', minHeight: 52 },
    sm: { fontSize: 16, padding: '10px 18px', minHeight: 44 },
  };
  const variants = {
    primary: { background: 'var(--navy)', color: '#fff', borderColor: 'var(--navy)' },
    teal: { background: 'var(--teal)', color: '#fff', borderColor: 'var(--teal)' },
    outline: { background: 'transparent', color: 'var(--navy)', borderColor: 'var(--line-strong)' },
    ghost: { background: 'transparent', color: 'var(--navy)', borderColor: 'transparent' },
  };
  const Tag = as;
  const props = as === 'a' ? { href } : { type: 'button', disabled };
  return (
    <Tag
      {...props}
      onClick={disabled ? undefined : onClick}
      aria-label={ariaLabel}
      style={{ ...base, ...sizes[size], ...variants[variant], opacity: disabled ? 0.5 : 1, ...style }}
      onMouseEnter={(e) => { if (!disabled) e.currentTarget.style.transform = 'translateY(-1px)'; }}
      onMouseLeave={(e) => { e.currentTarget.style.transform = 'translateY(0)'; }}
      {...rest}
    >
      {children}
    </Tag>
  );
};

// Onboarding survey with adaptive recommendation
const QUESTIONS = [
  {
    id: 'q1',
    prompt: 'Have you ever used a voice assistant like Siri or Alexa?',
    help: "A voice assistant lets you ask a device questions out loud.",
    options: [
      { id: 'yes',    label: 'Yes',                              weight: 0 },
      { id: 'no',     label: 'No',                               weight: 1 },
      { id: 'unsure', label: "Not sure what that is",            weight: 2 },
    ],
  },
  {
    id: 'q2',
    prompt: 'Have you heard of deepfake videos or voice cloning?',
    help: "These are fake videos or voices made by a computer that sound or look real.",
    options: [
      { id: 'know',    label: 'Yes, I know what they are',             weight: 0 },
      { id: 'heard',   label: "I've heard the terms but I'm not sure", weight: 1 },
      { id: 'new',     label: 'No, this is new to me',                 weight: 2 },
    ],
  },
  {
    id: 'q3',
    prompt: 'In the past year, have you received a suspicious email, text, or phone call?',
    options: [
      { id: 'yes',    label: 'Yes',         weight: 2 },
      { id: 'no',     label: 'No',          weight: 0 },
      { id: 'unsure', label: "I'm not sure", weight: 1 },
    ],
  },
  {
    id: 'q4',
    prompt: 'How confident do you feel about spotting online scams?',
    options: [
      { id: 'very',     label: 'Very confident',          weight: 0 },
      { id: 'somewhat', label: 'Somewhat confident',      weight: 1 },
      { id: 'not',      label: 'Not confident at all',    weight: 2 },
    ],
  },
];

// Map weighted score to recommended module (1-4)
const recommendModule = (answers) => {
  const score = QUESTIONS.reduce((s, q) => {
    const a = answers[q.id];
    const opt = q.options.find(o => o.id === a);
    return s + (opt ? opt.weight : 0);
  }, 0);
  // 0-8 range → map
  if (score <= 1) return 3;   // confident, no incidents — jump ahead
  if (score <= 3) return 2;   // moderate
  if (score <= 5) return 1;   // low-moderate
  return 1;                   // low — start from beginning
};

const Survey = ({ onNav, onComplete, surveyLayout, answers, setAnswers }) => {
  const [step, setStep] = React.useState('intro'); // intro | q-index | result

  const allAnswered = QUESTIONS.every(q => answers[q.id]);
  const recommended = allAnswered ? recommendModule(answers) : null;

  return (
    <main style={{ maxWidth: 880, margin: '0 auto', padding: '48px 40px 80px' }}>
      {step === 'intro' && (
        <SurveyIntro onStart={() => setStep(surveyLayout === 'stacked' ? 'stacked' : 0)} onNav={onNav} layout={surveyLayout}/>
      )}
      {surveyLayout === 'stacked' && step === 'stacked' && (
        <SurveyStacked
          answers={answers}
          setAnswers={setAnswers}
          onBack={() => setStep('intro')}
          onContinue={() => setStep('result')}
          allAnswered={allAnswered}
        />
      )}
      {typeof step === 'number' && (
        <SurveyStepped
          idx={step}
          answers={answers}
          setAnswers={setAnswers}
          onBack={() => setStep(step === 0 ? 'intro' : step - 1)}
          onNext={() => {
            if (step < QUESTIONS.length - 1) setStep(step + 1);
            else setStep('result');
          }}
        />
      )}
      {step === 'result' && (
        <SurveyResult recommended={recommended} onBegin={() => { onComplete(recommended); onNav('dashboard'); }} onEdit={() => setStep(surveyLayout === 'stacked' ? 'stacked' : 0)}/>
      )}
    </main>
  );
};

const Module2 = ({ onNav, onComplete }) => {
  // screens: lesson | exercise | correct | incorrect | explanation | summary
  const [screen, setScreen] = React.useState('lesson');
  const [attempts, setAttempts] = React.useState(0);
  const [showNudge, setShowNudge] = React.useState(false);

  const back = (
    <button onClick={() => onNav('dashboard')} style={{
      background: 'transparent', border: 'none', cursor: 'pointer',
      color: 'var(--ink-2)', fontSize: 17, fontFamily: 'inherit',
      display: 'inline-flex', alignItems: 'center', gap: 8, padding: '8px 0', marginBottom: 20,
    }}>
      <ArrowLeft size={18}/> Back to My Learning
    </button>
  );

  if (screen === 'lesson') return <Module2Lesson back={back} onStart={() => setScreen('exercise')}/>;
  if (screen === 'exercise') return (
    <Module2Exercise
      back={back}
      attempts={attempts}
      onAnswer={(isFake) => {
        setAttempts(a => a + 1);
        setScreen(isFake ? 'correct' : 'incorrect');
      }}
    />
  );
  if (screen === 'correct') return (
    <Module2Result
      kind="correct"
      back={back}
      onNext={() => setScreen('summary')}
      onReview={() => setScreen('lesson')}
    />
  );
  if (screen === 'summary') return (
    <Module2Summary back={back} onContinue={() => { onComplete(); onNav('dashboard'); }}/>
  );
  if (screen === 'incorrect') return (
    <>
      <Module2Incorrect
        back={back}
        onAction={(a) => {
          if (a === 'explain') setScreen('explanation');
          else if (a === 'hint' || a === 'retry') setScreen('exercise');
          else if (a === 'lesson') setScreen('lesson');
          else if (a === 'skip') {
            // Skipping after wrong — show gentle nudge
            setShowNudge(true);
          }
        }}
      />
      {showNudge && (
        <NudgeModal
          onYes={() => { setShowNudge(false); setScreen('explanation'); }}
          onNo={()  => { setShowNudge(false); setScreen('summary'); }}
        />
      )}
    </>
  );
  if (screen === 'explanation') return (
    <Module2Explanation back={back} onNext={() => setScreen('exercise')}/>
  );
  return null;
};

const M4_STEPS = [
  { id: 's1', title: "Contact your bank",           body: "Call your bank right away to freeze affected accounts and stop any transfers in progress." },
  { id: 's2', title: "Report to the FBI (ic3.gov)", body: "File a report at ic3.gov. This helps investigators and may help recover funds." },
  { id: 's3', title: "Change your passwords",       body: "Update passwords on your email, bank, and any accounts the scammer may have seen." },
  { id: 's4', title: "Tell someone you trust",      body: "A family member or friend can help you stay calm and think through next steps." },
  { id: 's5', title: "Be kind to yourself",         body: "These scams are engineered to fool anyone. Reporting it is the brave, helpful thing to do." },
];

const shuffle = (a) => {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
};

const Module4 = ({ onNav, onComplete }) => {
  const [screen, setScreen] = React.useState('lesson');
  const [order, setOrder] = React.useState(() => shuffle(M4_STEPS));
  const [submitted, setSubmitted] = React.useState(false);

  const back = <BackBar onBack={() => onNav('dashboard')}/>;

  const move = (i, dir) => {
    if (submitted) return;
    const j = i + dir;
    if (j < 0 || j >= order.length) return;
    const next = [...order];
    [next[i], next[j]] = [next[j], next[i]];
    setOrder(next);
  };

  if (screen === 'lesson') return (
    <main style={{ maxWidth: 900, margin: '0 auto', padding: '40px 40px 80px' }}>
      {back}
      <Eyebrow>Module 4 · Lesson</Eyebrow>

      <div style={{ display: 'grid', gap: 16, marginBottom: 28 }}>
        {M4_STEPS.map((s, i) => (
          <div key={s.id} style={{

              display: 'flex', alignItems: 'center', justifyContent: 'center',

              flexShrink: 0,
            }}>{i + 1}</div>
            <div>

              <div style={{ fontSize: 17, color: 'var(--ink-2)', lineHeight: 1.55 }}>{s.body}</div>

          </div>
        ))}
      </div>

      <div style={{
        background: '#EAF3F1', border: '1px solid #D4E8E4',
        borderRadius: 18, padding: '22px 26px',
        fontSize: 18, color: 'var(--teal-deep)', lineHeight: 1.55, marginBottom: 32,

        {back}
        <Eyebrow>Module 4 · Practice exercise</Eyebrow>
        <BigTitle>Put these steps in the right order.</BigTitle>
        <Lede>You've just realized you may have been scammed. Order the steps from first (top) to last (bottom).</Lede>

        <div style={{ display: 'grid', gap: 12, marginBottom: 28 }}>
          {order.map((s, i) => {
            const correctIdx = correctOrder.indexOf(s.id);
            const isCorrect = submitted && correctIdx === i;
            const isWrong = submitted && correctIdx !== i;
            return (
              <div key={s.id} style={{
                background: submitted ? (isCorrect ? '#EAF3F1' : '#FDECEB') : '#fff',
                border: `2px solid ${submitted ? (isCorrect ? 'var(--teal)' : '#C53030') : 'var(--line-strong)'}`,
                borderRadius: 14, padding: '16px 18px',
                display: 'grid', gridTemplateColumns: 'auto auto 1fr auto', gap: 14, alignItems: 'center',
              }}>
                <div style={{
                  width: 36, height: 36, borderRadius: 999,

                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontFamily: 'var(--f-display)', fontSize: 17, fontWeight: 700,
                }}>{i + 1}</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                  <button
                    onClick={() => move(i, -1)}
                    disabled={submitted || i === 0}
                    aria-label="Move up"
                    style={{
                      width: 36, height: 28, borderRadius: 6, cursor: submitted || i === 0 ? 'not-allowed' : 'pointer',
                      border: '1px solid var(--line-strong)', background: '#fff', color: 'var(--navy-ink)',
                      opacity: submitted || i === 0 ? 0.35 : 1, display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }}
                  >
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 15l6-6 6 6" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </button>
                  <button
                    onClick={() => move(i, 1)}
                    disabled={submitted || i === order.length - 1}
                    aria-label="Move down"
                    style={{
                      width: 36, height: 28, borderRadius: 6, cursor: submitted || i === order.length - 1 ? 'not-allowed' : 'pointer',
                      border: '1px solid var(--line-strong)', background: '#fff', color: 'var(--navy-ink)',
                      opacity: submitted || i === order.length - 1 ? 0.35 : 1, display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }}
                  >
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </button>
                </div>
                <div>
                  <div style={{ fontFamily: 'var(--f-display)', fontSize: 19, fontWeight: 700, color: 'var(--navy-ink)' }}>{s.title}</div>
                  <div style={{ fontSize: 15, color: 'var(--ink-2)' }}>{s.body}</div>
                </div>
                {submitted && (
                  <div style={{ fontSize: 14, fontWeight: 700, color: isCorrect ? 'var(--teal-deep)' : '#C53030' }}>
                    {isCorrect ? '✓ Right spot' : `Should be #${correctIdx + 1}`}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {!submitted ? (
          <Button variant="primary" onClick={() => setSubmitted(true)}>Check my order <ArrowRight/></Button>
        ) : (
          <>
            <div style={{
              background: allCorrect ? '#EAF3F1' : '#FFF4E0',
              border: `2px solid ${allCorrect ? 'var(--teal)' : '#E09A2B'}`,
              borderRadius: 18, padding: '22px 26px', marginBottom: 20,
            }}>
              <div style={{ fontFamily: 'var(--f-display)', fontSize: 22, fontWeight: 700, color: allCorrect ? 'var(--teal-deep)' : '#7A4A08', marginBottom: 6 }}>
                {allCorrect ? "Perfect order." : "Close — here's the recommended order."}
              </div>
              <div style={{ fontSize: 17, color: 'var(--ink-2)', lineHeight: 1.55 }}>
                Start with your bank to stop the money moving, then report to the FBI, then lock down passwords, then tell someone you trust. Being kind to yourself is what carries you through the rest.
              </div>
            </div>
            <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>
              <Button variant="primary" onClick={() => { onComplete(); onNav('dashboard'); }}>Finish module <ArrowRight/></Button>
              <Button variant="outline" onClick={() => { setOrder(shuffle(M4_STEPS)); setSubmitted(false); }}>Try again</Button>
            </div>
          </>
        )}
      </main>
    );
  }
  return null;
};

        [['cards', 'Cards'], ['list', 'List']]
      ))}

      {group('Display font', seg(
        { current: tweaks.fontPairing, setter: v => set('fontPairing', v) },
        [['inter', 'Inter'], ['serif', 'Serif']]
      ))}

      {group('Density', seg(
        { current: tweaks.density, setter: v => set('density', v) },
        [['standard', 'Standard'], ['roomy', 'Roomy']]
      ))}

      <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 4, lineHeight: 1.5 }}>
        Toggle Tweaks from the toolbar to hide this panel.
      </div>
    </div>
  );
};

Object.assign(window, { TweaksPanel });


// ===== src/app.jsx =====
// App shell + routing + state
const { useState, useEffect, useMemo } = React;

const STORAGE_KEY = 'aiaware:v1';

const loadState = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
};
const saveState = (s) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {} };

const getDefaults = () => {
  const el = document.getElementById('tweak-defaults');
  try { return JSON.parse(el.textContent.replace(/\/\*EDITMODE-(BEGIN|END)\*\//g, '')); } catch { return {}; }
};

function App() {
  const saved = loadState() || {};
  const defaults = getDefaults();

  const [page, setPage] = useState(saved.page || 'landing');
  const [openModule, setOpenModule] = useState(saved.openModule || null);
  const [answers, setAnswers] = useState(saved.answers || {});
  const [recommended, setRecommended] = useState(saved.recommended || null);
  const [progress, setProgress] = useState(saved.progress || { 1: 'not-started', 2: 'not-started', 3: 'not-started', 4: 'not-started' });
  const [tweaks, setTweaks] = useState({ ...defaults, ...(saved.tweaks || {}) });
  const [tweaksOpen, setTweaksOpen] = useState(false);

  // Persist
  useEffect(() => {
    saveState({ page, answers, recommended, progress, tweaks, openModule });
  }, [page, answers, recommended, progress, tweaks, openModule]);

  // Apply tweaks to root element
  useEffect(() => {
    document.documentElement.setAttribute('data-font', tweaks.fontPairing === 'serif' ? 'serif' : 'inter');
    document.documentElement.setAttribute('data-density', tweaks.density || 'standard');
  }, [tweaks.fontPairing, tweaks.density]);

  // Tweaks host wiring
  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  // Persist changed tweaks to host
  useEffect(() => {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: tweaks }, '*');
  }, [tweaks]);

  const handleNav = (id) => {
    if (id === 'help') {
      alert("Prototype: help center would open here.\n\nCall 1-800-555-1234 · Mon–Fri 8am–6pm");
      return;
    }
    setPage(id);
    window.scrollTo({ top: 0, behavior: 'instant' });
  };

  const handleOpenModule = (n) => {
    setOpenModule(n);
    setPage('module');
    window.scrollTo({ top: 0, behavior: 'instant' });
  };

  const handleSurveyComplete = (modNum) => {
    setRecommended(modNum);
    setProgress(p => ({ ...p, [modNum]: p[modNum] === 'completed' ? 'completed' : 'in-progress' }));
  };

  const handleProgressChange = (n, status) => {
    setProgress(p => ({ ...p, [n]: status }));
  };

  const overallProgress = useMemo(() => {
    if (page === 'landing' || !recommended) return null;
    const done = Object.values(progress).reduce((s, p) => s + (p === 'completed' ? 1 : p === 'in-progress' ? 0.5 : 0), 0);
    return Math.round((done / 4) * 100);
  }, [progress, recommended, page]);

  return (
    <>
      <TopBar currentPage={page} onNav={handleNav} progress={overallProgress}/>
      {page === 'landing' && <Landing onNav={handleNav} heroVariant={tweaks.heroVariant}/>}
      {page === 'survey' && (
        <Survey
          onNav={handleNav}
          onComplete={handleSurveyComplete}
          surveyLayout={tweaks.surveyLayout}
          answers={answers}
          setAnswers={setAnswers}
        />
      )}
      {page === 'dashboard' && (
        <Dashboard
          onNav={handleNav}
          recommended={recommended}
          progress={progress}
          dashboardStyle={tweaks.dashboardStyle}
          onProgressChange={handleProgressChange}
          onOpenModule={handleOpenModule}
        />
      )}
      {page === 'module' && openModule === 1 && (
        <Module1 onNav={handleNav} onComplete={() => handleProgressChange(1, 'completed')}/>
      )}
      {page === 'module' && openModule === 2 && (
        <Module2 onNav={handleNav} onComplete={() => handleProgressChange(2, 'completed')}/>
      )}
      {page === 'module' && openModule === 3 && (
        <Module3 onNav={handleNav} onComplete={() => handleProgressChange(3, 'completed')}/>
      )}
      {page === 'module' && openModule === 4 && (
        <Module4 onNav={handleNav} onComplete={() => handleProgressChange(4, 'completed')}/>
      )}
      <Footer onNav={handleNav}/>
      {tweaksOpen && <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} onClose={() => {
        setTweaksOpen(false);
        window.parent.postMessage({ type: '__deactivate_edit_mode' }, '*');
      }}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);


</script>
</body>
